<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Link Tour Hotel - Travel Tourism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand text-white">TRAVEL TOURISM - Link Tour Hotel</span>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="admin.html">Manage Tours</a>
                <a class="btn btn-outline-light btn-sm me-2" href="admin-hotels.html">Manage Hotels</a>
                <a class="btn btn-outline-light btn-sm" href="Index.html">Back to site</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <div id="denied" class="alert alert-danger" style="display:none;"></div>

        <div id="adminPanel" style="display:none;">

            <div id="adminMessage" class="alert" style="display:none;"></div>

            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4>Allot a hotel to a tour</h4>
                    <p class="text-muted">
                        Linking the same tour and hotel again updates the allotment.
                    </p>

                    <form id="linkForm">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="tourSelect" class="form-label">Tour</label>
                                <select id="tourSelect" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="hotelSelect" class="form-label">Hotel</label>
                                <select id="hotelSelect" class="form-select" required></select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="allotment" class="form-label">Allotment (rooms)</label>
                                <input type="number" id="allotment" class="form-control" min="0" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Allot</button>
                    </form>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <h4>Current links</h4>
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>Tour</th>
                                <th>Hotel</th>
                                <th>Allotment</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="linkTableBody"></tbody>
                    </table>
                    <p id="noLinks" class="text-center text-muted" style="display:none;">No links yet.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="admin-link.js"></script>
</body>
</html>
