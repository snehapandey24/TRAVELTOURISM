<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin - Travel Tourism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand text-white">TRAVEL TOURISM - Admin</span>
            <a class="btn btn-outline-light btn-sm" href="Index.html">Back to site</a>
        </div>
    </nav>

    <div class="container my-4">

        <div id="denied" class="alert alert-danger" style="display:none;"></div>

        <div id="adminPanel" style="display:none;">

            <div id="adminMessage" class="alert" style="display:none;"></div>

            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4 id="formTitle">Add Tour</h4>

                    <form id="tourForm">
                        <input type="hidden" id="tourId">

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="destination" class="form-label">Destination</label>
                                <input type="text" id="destination" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="duration" class="form-label">Duration</label>
                                <input type="text" id="duration" class="form-control"
                                       placeholder="e.g. 5 Days / 4 Nights" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="price" class="form-label">Price (Rs)</label>
                                <input type="number" id="price" class="form-control" min="0" step="0.01" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="imageUrl" class="form-label">Image URL (optional)</label>
                            <input type="text" id="imageUrl" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Tour</button>
                        <button type="button" id="cancelEdit" class="btn btn-secondary" style="display:none;">
                            Cancel Edit
                        </button>
                    </form>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <h4>All Tours</h4>
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Destination</th>
                                <th>Duration</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tourTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
