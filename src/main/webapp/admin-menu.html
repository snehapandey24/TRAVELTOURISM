<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Menu - Travel Tourism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand text-white">TRAVEL TOURISM - Admin Menu</span>
            <a class="btn btn-outline-light btn-sm" href="Index.html">Back to site</a>
        </div>
    </nav>

    <div class="container my-4">

        <div id="denied" class="alert alert-danger" style="display:none;"></div>

        <div id="menu" class="row g-4" style="display:none;">

            <div class="col-md-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title">Tours</h5>
                        <p class="card-text">Add, update and delete tours.</p>
                        <a href="admin.html" class="btn btn-primary">Manage Tours</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title">Hotels</h5>
                        <p class="card-text">Add, update and delete hotels.</p>
                        <a href="admin-hotels.html" class="btn btn-primary">Manage Hotels</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title">Link Tour Hotel</h5>
                        <p class="card-text">Allot hotels and rooms to a tour.</p>
                        <a href="admin-link.html" class="btn btn-primary">Link Tour Hotel</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h5 class="card-title">Booking Details</h5>
                        <p class="card-text">Search any booking by its ID.</p>
                        <a href="booking-details.html" class="btn btn-primary">Search Booking</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        fetch("session")
            .then(function(response) {
                let denied = document.getElementById("denied");
                if (!response.ok) {
                    denied.textContent = "Please log in as an admin on the main site first.";
                    denied.style.display = "block";
                } else if (response.headers.get("X-User-Role") !== "ADMIN") {
                    denied.textContent = "Access denied. This page is for admins only.";
                    denied.style.display = "block";
                } else {
                    document.getElementById("menu").style.display = "flex";
                }
            })
            .catch(function() {
                let denied = document.getElementById("denied");
                denied.textContent = "Could not reach the server. Is Tomcat running?";
                denied.style.display = "block";
            });
    </script>
</body>
</html>
