<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Booking Details - Travel Tourism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand text-white">TRAVEL TOURISM - Booking Details</span>
            <a class="btn btn-outline-light btn-sm" href="Index.html">Back to site</a>
        </div>
    </nav>

    <div class="container my-4">

        <div id="notice" class="alert" style="display:none;"></div>

        <div id="searchPanel" style="display:none;">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4>Search a booking</h4>

                    <form id="searchForm" class="row g-2 align-items-end">
                        <div class="col-md-6">
                            <label for="bookId" class="form-label">Booking ID</label>
                            <input type="number" id="bookId" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary">Search</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="resultCard" class="card shadow" style="display:none;">
                <div class="card-body">
                    <h4>Booking found</h4>
                    <div style="overflow-x: auto;">
                        <table class="table table-striped mt-3">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Destination</th>
                                    <th>Hotels</th>
                                    <th>Room</th>
                                    <th>Travel Date</th>
                                    <th>People</th>
                                    <th>Booked On</th>
                                </tr>
                            </thead>
                            <tbody id="resultBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="booking-details.js"></script>
</body>
</html>
