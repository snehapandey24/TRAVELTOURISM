<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Hotels - Travel Tourism</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand text-white">TRAVEL TOURISM - Admin Hotels</span>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="admin.html">Manage Tours</a>
                <a class="btn btn-outline-light btn-sm" href="Index.html">Back to site</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <div id="denied" class="alert alert-danger" style="display:none;"></div>

        <div id="adminPanel" style="display:none;">

            <div id="adminMessage" class="alert" style="display:none;"></div>

            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4 id="formTitle">Add Hotel</h4>

                    <form id="hotelForm">
                        <input type="hidden" id="hotelId">

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="hotelName" class="form-label">Hotel Name</label>
                                <input type="text" id="hotelName" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="location" class="form-label">Place</label>
                                <input type="text" id="location" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="pricePerNight" class="form-label">Price per night (Rs, optional)</label>
                                <input type="number" id="pricePerNight" class="form-control" min="0" step="0.01">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description (optional)</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Hotel</button>
                        <button type="button" id="cancelEdit" class="btn btn-secondary" style="display:none;">
                            Cancel Edit
                        </button>
                    </form>
                </div>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <h4>All Hotels</h4>
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Hotel</th>
                                <th>Place</th>
                                <th>Price / night</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="hotelTableBody"></tbody>
                    </table>
                    <p id="noHotels" class="text-center text-muted" style="display:none;">No hotels yet.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="admin-hotels.js"></script>
</body>
</html>
